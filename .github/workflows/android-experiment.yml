name: Build experimental Android APK

on:
  # Stejný gate jako build-apk.yml: `needs:` se resolvuje jen uvnitř jednoho
  # souboru, takže se čeká na `workflow_run` (viz `name:` v ci.yml) a hotovo se
  # ověřuje až v podmínce jobu. `branches:` filtruje běhy CI podle větve,
  # `workflow_run.event == 'push'` v podmínce jobu zabraňuje, aby fork přes PR
  # spustil build s právy repozitáře.
  workflow_run:
    workflows: ["SongCraft CI"]
    types: [completed]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build experimental Android APK
    # Experimentální APK se nikdy nesmí vydávat pod stejným `app-v*` tagem jako
    # build-apk.yml. Zároveň musí čekat na hermetic CI — jinak se může
    # experimentální build zapsat na hlavní větev přes chybný kód.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout experiment
        uses: actions/checkout@v4
        with:
          # Pod `workflow_run` je výchozí checkout větev `default_branch`, ne
          # commit, který CI otestovalo.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Verify Expo configuration
        run: |
          npx expo-doctor
          npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: songcraft-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Read app version
        id: app-version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish update release
        # Větev, ze které se experimentální release vydává: u `workflow_run` je
        # to větev spuštěného CI běhu (`github.ref` ukazuje na výchozí větev),
        # u ručního dispatchu reference, ze které bylo spuštěno.
        if: >-
          github.event_name == 'workflow_dispatch'
          ? github.ref == 'refs/heads/main'
          : github.event.workflow_run.head_branch == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: experimental-v${{ steps.app-version.outputs.version }}
          name: SongCraft Studio experiment v${{ steps.app-version.outputs.version }}
          body: |
            Experimentální sestavení APK (debug podpis, žádný release klíč).
            Není určeno k instalaci přes app-update.ts — ruční stažení a
            kontrolovaná instalace. Může se lišit podepisem od `app-v*` release.
          files: android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
